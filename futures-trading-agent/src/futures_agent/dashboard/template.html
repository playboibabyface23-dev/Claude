<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Futures Trading Agent — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --border: #262d38;
    --text: #e6edf3; --muted: #8b96a5;
    --accent: #4f8cff; --pass: #3fb950; --warn: #d29922; --fail: #f85149;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header {
    display: flex; align-items: center; gap: 12px; padding: 16px 24px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .p-pass { background: rgba(63,185,80,.15); color: var(--pass); }
  .p-warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .p-fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .stamp { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .tile .v.pos { color: var(--pass); }
  .tile .v.neg { color: var(--fail); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 16px 18px; margin-bottom: 20px; overflow-x: auto; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
              color: var(--muted); margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .bar-track { background: #21262d; border-radius: 4px; height: 8px; width: 100px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; background: var(--accent); }
  .mono { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; }
  }
</style>
</head>
<body>
<!--SNAPSHOT_INJECTION_POINT-->
<header>
  <h1>Futures Trading Agent <span>/ Dashboard</span></h1>
  <span id="running-pill"></span>
  <span id="kill-pill"></span>
  <div class="stamp">Snapshot <b id="stamp">—</b></div>
</header>
<main>
  <div class="tiles" id="tiles"></div>

  <section>
    <h2>Open Positions</h2>
    <div id="positions"></div>
  </section>

  <section>
    <h2>AI Confidence History</h2>
    <div id="confidence"></div>
  </section>

  <section>
    <h2>Trade History</h2>
    <div id="trades"></div>
  </section>

  <section>
    <h2>Recent Rejections</h2>
    <div id="rejections"></div>
  </section>
</main>
<script>
const S = window.__SNAPSHOT__ || {};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[c])); }
function money(v) { return v == null ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function pct(v) { return v == null ? "—" : (v * 100).toFixed(1) + "%"; }
function el(id) { return document.getElementById(id); }
function table(headers, rows) {
  if (!rows.length) return '<div class="empty">Nothing yet.</div>';
  return `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>` +
        `<tbody>${rows.join("")}</tbody></table>`;
}

const acct = S.account || {};
el("stamp").textContent = S.generated_at ? new Date(S.generated_at).toLocaleString() : "—";
el("running-pill").innerHTML = S.running
  ? '<span class="pill p-pass">running</span>' : '<span class="pill p-fail">stopped</span>';
el("kill-pill").innerHTML = acct.kill_switch_active
  ? '<span class="pill p-fail">kill switch active</span>' : '<span class="pill p-pass">kill switch clear</span>';

const stats = S.stats || {};
el("tiles").innerHTML = [
  ["Equity", money(acct.equity), ""],
  ["Today's P&L", money(acct.daily_pnl), acct.daily_pnl > 0 ? "pos" : acct.daily_pnl < 0 ? "neg" : ""],
  ["Win Rate", pct(stats.win_rate), ""],
  ["Trades Today", String(acct.trades_today ?? 0), ""],
  ["Open Positions", String(acct.open_positions ?? 0), ""],
  ["Total P&L", money(stats.total_pnl), stats.total_pnl > 0 ? "pos" : stats.total_pnl < 0 ? "neg" : ""],
].map(([k, v, cls]) => `<div class="tile"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`).join("");

el("positions").innerHTML = table(
  ["Symbol", "Action", "Contracts", "Entry", "Stop", "Target", "Opened"],
  (S.positions || []).map(p => `<tr>
    <td>${esc(p.symbol)}</td><td>${esc(p.action)}</td><td>${p.contracts}</td>
    <td class="mono">${p.entry_price ?? "—"}</td><td class="mono">${p.stop_price ?? "—"}</td>
    <td class="mono">${p.target_price ?? "—"}</td>
    <td>${new Date(p.opened_at).toLocaleString()}</td>
  </tr>`)
);

el("confidence").innerHTML = table(
  ["Symbol", "Action", "Confidence", "", "Reason", "At"],
  (S.confidence_history || []).map(c => `<tr>
    <td>${esc(c.symbol)}</td><td>${esc(c.action)}</td>
    <td class="mono">${c.confidence.toFixed(0)}%</td>
    <td><div class="bar-track"><div class="bar-fill" style="width:${c.confidence}%"></div></div></td>
    <td>${esc(c.entry_reason || "")}</td>
    <td>${new Date(c.created_at).toLocaleString()}</td>
  </tr>`)
);

el("trades").innerHTML = table(
  ["Symbol", "Action", "Contracts", "Entry", "Exit", "P&L", "Status", "Opened", "Closed"],
  (S.recent_trades || []).map(t => `<tr>
    <td>${esc(t.symbol)}</td><td>${esc(t.action)}</td><td>${t.contracts}</td>
    <td class="mono">${t.entry_price ?? "—"}</td><td class="mono">${t.exit_price ?? "—"}</td>
    <td class="mono ${t.pnl > 0 ? "" : t.pnl < 0 ? "" : ""}">${t.pnl != null ? money(t.pnl) : "—"}</td>
    <td>${esc(t.status)}</td>
    <td>${new Date(t.opened_at).toLocaleString()}</td>
    <td>${t.closed_at ? new Date(t.closed_at).toLocaleString() : "—"}</td>
  </tr>`)
);

el("rejections").innerHTML = table(
  ["Symbol", "Reason", "Detail", "At"],
  (S.recent_rejections || []).map(r => `<tr>
    <td>${esc(r.symbol || "—")}</td><td>${esc(r.reason)}</td>
    <td>${esc(r.detail || "")}</td>
    <td>${new Date(r.created_at).toLocaleString()}</td>
  </tr>`)
);
</script>
</body>
</html>
